<svg xmlns="http://www.w3.org/2000/svg" width="920" height="530" viewBox="0 0 920 530" role="img" aria-labelledby="title desc">
  <title id="title">Pretty progress terminal preview</title>
  <desc id="desc">A color terminal preview of skilpel pretty progress output showing configuration, eval results, gates, and a passed result.</desc>
  <style>
    .bg { fill: #0f1117; }
    .chrome { fill: #1b1f2a; }
    .text { fill: #e5e7eb; font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .muted { fill: #9ca3af; }
    .bold { font-weight: 700; }
    .green { fill: #22c55e; }
    .cyan { fill: #06b6d4; }
  </style>
  <rect class="bg" x="0" y="0" width="920" height="530" rx="8" />
  <rect class="chrome" x="0" y="0" width="920" height="38" rx="8" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#f59e0b" />
  <circle cx="66" cy="19" r="6" fill="#22c55e" />

  <text class="text bold" x="28" y="72">Validating skills: ./skills</text>

  <text class="text bold" x="28" y="118">Configuration</text>
  <text class="text" x="48" y="148"><tspan class="cyan">ℹ</tspan> 1 skill, 1 eval</text>
  <text class="text" x="48" y="178"><tspan class="cyan">ℹ</tspan> provider=openai target=gpt-4o-mini judge=gpt-4o-mini without_skill=true</text>

  <text class="text bold" x="28" y="232">Evals</text>
  <text class="text" x="48" y="262"><tspan class="green">✓</tspan> shell-script / new-script-strict-mode: 2 passed, 0 failed</text>
  <text class="text" x="70" y="292"><tspan class="cyan">with:</tspan> <tspan class="bold">100%</tspan></text>
  <text class="text" x="70" y="322"><tspan class="cyan">without:</tspan> <tspan class="bold">50%</tspan></text>
  <text class="text" x="70" y="352"><tspan class="cyan">delta:</tspan> <tspan class="bold">50%</tspan></text>

  <text class="muted text" x="28" y="388">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>

  <text class="text bold" x="28" y="424">Gates</text>
  <text class="text" x="48" y="454"><tspan class="green">✓</tspan> minimum pass rate: threshold 90%</text>
  <text class="text" x="48" y="484"><tspan class="green">✓</tspan> minimum delta: threshold 20%</text>

  <text class="text" x="28" y="516"><tspan class="green bold">Result: ✓ passed</tspan></text>
</svg>
